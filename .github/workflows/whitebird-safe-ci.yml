name: WhiteBird safe CI

on:
  push:
    branches: [feature/secure-auth-approval]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q safe-demo
      - name: Run isolated offline tests
        shell: bash
        run: |
          python -m unittest discover -s safe-demo/tests -p 'test_*.py' -v 2>&1 | tee test-results.txt
          exit ${PIPESTATUS[0]}
      - name: Upload test logs (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.txt
          if-no-files-found: ignore
          retention-days: 14

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse local diagnostic script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          Get-ChildItem 'safe-demo/windows-agent' -Filter '*.ps1' | ForEach-Object {
          $file = $_.FullName
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          }

  windows-diagnostic-package:
    needs: [powershell-syntax, python-checks]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create versioned diagnostic package
        shell: pwsh
        run: |
          $source = 'safe-demo/windows-agent'
          Compress-Archive -Path "$source/*" -DestinationPath 'WhiteBird-LocalDiagnostics.zip' -Force
          (Get-FileHash 'WhiteBird-LocalDiagnostics.zip' -Algorithm SHA256).Hash |
            Set-Content 'WhiteBird-LocalDiagnostics.sha256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: whitebird-local-diagnostics
          path: |
            WhiteBird-LocalDiagnostics.zip
            WhiteBird-LocalDiagnostics.sha256.txt
          retention-days: 14
