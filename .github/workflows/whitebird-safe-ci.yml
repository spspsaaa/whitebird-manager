name: WhiteBird safe CI

on:
  push:
    branches: [feature/secure-auth-approval]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q safe-demo
      - name: Run isolated offline tests
        run: python -m unittest discover -s safe-demo/tests -p 'test_*.py' -v
