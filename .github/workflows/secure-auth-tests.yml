name: Secure auth tests

on:
  push:
    branches:
      - feature/secure-auth-approval
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q safe-demo
      - name: Run offline approval tests
        working-directory: safe-demo
        run: python -m unittest -v test_secure_auth test_session_manager test_browser_adapter test_cloud_preflight
